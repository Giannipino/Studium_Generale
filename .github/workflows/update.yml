name: Studium Generale aktualisieren

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 05:17 (Winterzeit) / 06:17 (Sommerzeit) deutscher Zeit
  workflow_dispatch:        # manuell starten: Actions -> "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: pip install --quiet beautifulsoup4

      - name: Termine von der Uni-Webseite lesen
        id: scrape
        continue-on-error: true
        run: python3 scrape.py

      - name: Fallback – Claude liest das Programm
        if: steps.scrape.outcome == 'failure' && env.HAS_CLAUDE_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Das Skript scrape.py ist fehlgeschlagen. Lies AGENT.md und aktualisiere events.json wie dort beschrieben.
            Committe NICHT selbst. Schreibe Deinen Bericht in LETZTER_LAUF.md.
          claude_args: "--allowedTools Bash,Read,Write,Edit,WebFetch,WebSearch"

      - name: Abbrechen, wenn keine Quelle funktioniert hat
        if: steps.scrape.outcome == 'failure' && env.HAS_CLAUDE_KEY != 'true'
        run: |
          echo "scrape.py ist fehlgeschlagen und kein ANTHROPIC_API_KEY als Fallback hinterlegt."
          exit 1

      - name: ICS erzeugen und Änderungen committen
        run: |
          python3 generate_ics.py
          git config user.name "studium-generale-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- events.json; then
            echo "Keine inhaltlichen Änderungen."
          else
            git add -A
            git commit -m "Studium Generale: automatische Aktualisierung $(date +%F)"
            git push
          fi

      - name: Fehler melden
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::scrape.py ist fehlgeschlagen – bitte prüfen, ob die Uni-Seite umgebaut wurde."
